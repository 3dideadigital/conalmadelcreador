<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla desierto — Con Alma del Creador</title>
<link rel="stylesheet" href="comun.css">
</head>
<body>
<canvas id="lienzo" width="1080" height="1920"></canvas>
<script src="comun.js"></script>
<script>
// Plantilla "desierto": fondo nocturno de dunas con un amanecer que sube
// durante el reel, texto por escenas y cierre con el logo cruz-wifi.
// Uso en el navegador: desierto.html?guion=../guiones/01-desierto.json
// El renderizador llama a window.dibujar(t) fotograma a fotograma.

const azar = aleatorio(14);
const ESTRELLAS = Array.from({ length: 150 }, () => ({
  x: azar() * W, y: azar() * 1350, r: 0.8 + azar() * 2.0,
  fase: azar() * Math.PI * 2, vel: 0.6 + azar() * 1.8,
}));
const ARENA = Array.from({ length: 70 }, () => ({
  x: azar() * W, y: 1150 + azar() * 650, r: 0.8 + azar() * 1.8,
  vel: 8 + azar() * 22, fase: azar() * Math.PI * 2,
}));
const DUNAS = [
  { base: 1430, ondas: [[46, 0.0042, 0.3], [18, 0.011, 1.7]], vel: 0.020, relleno: ["#1b130a", "#0d0906"], borde: 0.55 },
  { base: 1560, ondas: [[38, 0.0036, 2.1], [14, 0.013, 0.4]], vel: 0.035, relleno: ["#140e07", "#090604"], borde: 0.40 },
  { base: 1700, ondas: [[30, 0.0050, 4.0], [12, 0.009, 2.6]], vel: 0.055, relleno: ["#0d0905", "#050302"], borde: 0.30 },
];

// --- fondo ----------------------------------------------------------------
function dibujarFondo(t, dur) {
  const amanecer = suave(t / dur);
  ctx.fillStyle = "#060504";
  ctx.fillRect(0, 0, W, H);

  // Resplandor del horizonte: crece a lo largo del reel (de la noche a la esperanza).
  const solY = 1430 - 140 * amanecer;
  let g = ctx.createRadialGradient(540, solY, 0, 540, solY, 1250);
  g.addColorStop(0, `rgba(176,128,62,${0.50 + 0.25 * amanecer})`);
  g.addColorStop(0.35, `rgba(96,66,30,${0.28 + 0.12 * amanecer})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  g = ctx.createRadialGradient(540, solY, 0, 540, solY, 260);
  g.addColorStop(0, `rgba(255,222,165,${0.55 + 0.3 * amanecer})`);
  g.addColorStop(0.4, `rgba(232,180,104,${0.22 + 0.15 * amanecer})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Estrellas que titilan y se apagan un poco al amanecer.
  for (const e of ESTRELLAS) {
    const brillo = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * e.vel + e.fase))) * (1 - 0.5 * amanecer);
    ctx.fillStyle = `rgba(255,244,220,${brillo * 0.8})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }

  // Dunas en capas con un filo dorado, desplazándose despacio.
  for (const d of DUNAS) {
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 6) {
      let y = d.base;
      for (const [a, f, p] of d.ondas) y += a * Math.sin(x * f + p + t * d.vel * 6);
      x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${ORO_RGB},${d.borde})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineTo(W + 10, H); ctx.lineTo(-10, H); ctx.closePath();
    const gd = ctx.createLinearGradient(0, d.base - 60, 0, H);
    gd.addColorStop(0, d.relleno[0]); gd.addColorStop(1, d.relleno[1]);
    ctx.fillStyle = gd;
    ctx.fill();
  }

  // Granos de arena flotando.
  for (const a of ARENA) {
    const x = (a.x + t * a.vel) % W;
    const y = a.y + 10 * Math.sin(t * 0.8 + a.fase);
    ctx.fillStyle = `rgba(${ORO_RGB},${0.25 + 0.25 * Math.sin(t * 1.3 + a.fase)})`;
    ctx.beginPath(); ctx.arc(x, y, a.r, 0, Math.PI * 2); ctx.fill();
  }

  // Viñeta.
  g = ctx.createRadialGradient(540, 900, 500, 540, 900, 1300);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// --- fotograma -------------------------------------------------------------
iniciarPlantilla((guion, t) => {
  dibujarFondo(t, guion.duracion);
  const esc = escenaEn(guion, t);
  if (esc.tipo === "cierre") dibujarCierre(esc, t);
  else {
    dibujarEscenaTexto(esc, t);
    // Marca de agua pequeña: el reel sigue siendo reconocible si se reenvía.
    dibujarLogo(540, 250, 70, 1, 0.55);
  }
});
</script>
</body>
</html>
