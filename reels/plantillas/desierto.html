<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla desierto — Con Alma del Creador</title>
<style>
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: normal;
    src: url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 600; font-style: normal;
    src: url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: italic;
    src: url("../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 500; font-style: normal;
    src: url("../node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; height: 100vh; width: auto; max-width: 100vw; }
  body.render canvas { height: 1920px; width: 1080px; max-width: none; }
</style>
</head>
<body>
<canvas id="lienzo" width="1080" height="1920"></canvas>
<script>
// Plantilla "desierto": fondo nocturno de dunas con un amanecer que sube
// durante el reel, texto por escenas y cierre con el logo cruz-wifi.
// Uso en el navegador: desierto.html?guion=../guiones/01-desierto.json
// El renderizador llama a window.dibujar(t) fotograma a fotograma.

const W = 1080, H = 1920;
const ORO = "#d4af6a";
const ORO_RGB = "212,175,106";
const BLANCO = "#f4efe6";
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");

const ESTILOS = {
  grande:     { fuente: "500 112px Cormorant", color: BLANCO, alto: 126 },
  oroGrande:  { fuente: "600 140px Cormorant", color: ORO, alto: 158 },
  normal:     { fuente: "500 86px Cormorant", color: BLANCO, alto: 100 },
  oro:        { fuente: "600 104px Cormorant", color: ORO, alto: 118 },
  cita:       { fuente: "italic 500 82px Cormorant", color: BLANCO, alto: 96 },
  referencia: { fuente: "500 34px Montserrat", color: ORO, alto: 90, espaciado: 10 },
};

// --- utilidades -----------------------------------------------------------
const limitar = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const suave = x => { x = limitar(x); return x * x * (3 - 2 * x); };
const salida = x => 1 - Math.pow(1 - limitar(x), 3);
function aleatorio(semilla) {
  return () => { semilla = (semilla * 1664525 + 1013904223) % 4294967296; return semilla / 4294967296; };
}

const azar = aleatorio(14);
const ESTRELLAS = Array.from({ length: 150 }, () => ({
  x: azar() * W, y: azar() * 1350, r: 0.8 + azar() * 2.0,
  fase: azar() * Math.PI * 2, vel: 0.6 + azar() * 1.8,
}));
const ARENA = Array.from({ length: 70 }, () => ({
  x: azar() * W, y: 1150 + azar() * 650, r: 0.8 + azar() * 1.8,
  vel: 8 + azar() * 22, fase: azar() * Math.PI * 2,
}));
const DUNAS = [
  { base: 1430, ondas: [[46, 0.0042, 0.3], [18, 0.011, 1.7]], vel: 0.020, relleno: ["#1b130a", "#0d0906"], borde: 0.55 },
  { base: 1560, ondas: [[38, 0.0036, 2.1], [14, 0.013, 0.4]], vel: 0.035, relleno: ["#140e07", "#090604"], borde: 0.40 },
  { base: 1700, ondas: [[30, 0.0050, 4.0], [12, 0.009, 2.6]], vel: 0.055, relleno: ["#0d0905", "#050302"], borde: 0.30 },
];

// --- fondo ----------------------------------------------------------------
function dibujarFondo(t, dur) {
  const amanecer = suave(t / dur);
  ctx.fillStyle = "#060504";
  ctx.fillRect(0, 0, W, H);

  // Resplandor del horizonte: crece a lo largo del reel (de la noche a la esperanza).
  const solY = 1430 - 140 * amanecer;
  let g = ctx.createRadialGradient(540, solY, 0, 540, solY, 1250);
  g.addColorStop(0, `rgba(176,128,62,${0.50 + 0.25 * amanecer})`);
  g.addColorStop(0.35, `rgba(96,66,30,${0.28 + 0.12 * amanecer})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  g = ctx.createRadialGradient(540, solY, 0, 540, solY, 260);
  g.addColorStop(0, `rgba(255,222,165,${0.55 + 0.3 * amanecer})`);
  g.addColorStop(0.4, `rgba(232,180,104,${0.22 + 0.15 * amanecer})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Estrellas que titilan y se apagan un poco al amanecer.
  for (const e of ESTRELLAS) {
    const brillo = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * e.vel + e.fase))) * (1 - 0.5 * amanecer);
    ctx.fillStyle = `rgba(255,244,220,${brillo * 0.8})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }

  // Dunas en capas con un filo dorado, desplazándose despacio.
  for (const d of DUNAS) {
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 6) {
      let y = d.base;
      for (const [a, f, p] of d.ondas) y += a * Math.sin(x * f + p + t * d.vel * 6);
      x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${ORO_RGB},${d.borde})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineTo(W + 10, H); ctx.lineTo(-10, H); ctx.closePath();
    const gd = ctx.createLinearGradient(0, d.base - 60, 0, H);
    gd.addColorStop(0, d.relleno[0]); gd.addColorStop(1, d.relleno[1]);
    ctx.fillStyle = gd;
    ctx.fill();
  }

  // Granos de arena flotando.
  for (const a of ARENA) {
    const x = (a.x + t * a.vel) % W;
    const y = a.y + 10 * Math.sin(t * 0.8 + a.fase);
    ctx.fillStyle = `rgba(${ORO_RGB},${0.25 + 0.25 * Math.sin(t * 1.3 + a.fase)})`;
    ctx.beginPath(); ctx.arc(x, y, a.r, 0, Math.PI * 2); ctx.fill();
  }

  // Viñeta.
  g = ctx.createRadialGradient(540, 900, 500, 540, 900, 1300);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// --- logo cruz-wifi -------------------------------------------------------
// p: 0→1 progreso de aparición (cruz y luego las tres ondas una a una).
function dibujarLogo(cx, arriba, alto, p, alfa = 1) {
  const grosor = alto * 0.05;
  const brazo = alto * 0.58;
  const brazoY = arriba + alto * 0.30;
  const pCruz = salida(p / 0.45);
  ctx.save();
  ctx.globalAlpha = alfa;
  ctx.fillStyle = BLANCO;
  // Palo vertical que crece desde abajo.
  const h = alto * pCruz;
  ctx.fillRect(cx - grosor / 2, arriba + alto - h, grosor, h);
  // Travesaño que se abre desde el centro.
  const pBrazo = salida((p - 0.25) / 0.3);
  if (pBrazo > 0) ctx.fillRect(cx - brazo / 2 * pBrazo, brazoY - grosor / 2, brazo * pBrazo, grosor);
  // Ondas wifi sobre la cruz, encendiéndose de dentro hacia fuera.
  ctx.lineCap = "round";
  ctx.lineWidth = grosor * 0.95;
  for (let i = 0; i < 3; i++) {
    const pOnda = salida((p - 0.5 - i * 0.14) / 0.18);
    if (pOnda <= 0) continue;
    const r = alto * (0.12 + i * 0.12);
    ctx.strokeStyle = `rgba(${ORO_RGB},${pOnda})`;
    ctx.shadowColor = `rgba(${ORO_RGB},${0.8 * pOnda})`;
    ctx.shadowBlur = 30 * pOnda;
    ctx.beginPath();
    ctx.arc(cx, arriba - alto * 0.02, r, Math.PI * 1.25, Math.PI * 1.75);
    ctx.stroke();
  }
  ctx.restore();
}

// --- texto ----------------------------------------------------------------
function dibujarLinea(texto, estilo, x, y, alfa, subida) {
  const e = ESTILOS[estilo] || ESTILOS.normal;
  ctx.save();
  ctx.globalAlpha = alfa;
  ctx.font = e.fuente;
  ctx.fillStyle = e.color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (e.espaciado) ctx.letterSpacing = `${e.espaciado}px`;
  ctx.shadowColor = "rgba(0,0,0,0.6)";
  ctx.shadowBlur = 24;
  ctx.fillText(texto, x, y + subida);
  ctx.restore();
}

function dibujarEscenaTexto(esc, t) {
  const lineas = esc.lineas;
  const total = lineas.reduce((s, l) => s + (ESTILOS[l.estilo] || ESTILOS.normal).alto, 0);
  let y = 840 - total / 2;
  const fuera = 1 - suave((t - (esc.fin - 0.45)) / 0.45);
  lineas.forEach((l, i) => {
    const alto = (ESTILOS[l.estilo] || ESTILOS.normal).alto;
    const centro = y + alto / 2;
    y += alto;
    let entrada = 1;
    if (!esc.visibleDesdeInicio) {
      const desde = esc.inicio + (l.en ?? i * 0.28);
      entrada = salida((t - desde) / 0.7);
    }
    if (entrada <= 0) return;
    dibujarLinea(l.texto, l.estilo, 540, centro, entrada * fuera, 26 * (1 - entrada));
  });
}

function dibujarCierre(esc, t) {
  const p = (t - esc.inicio) / 1.9;
  const entrada = salida((t - esc.inicio) / 0.5);
  dibujarLogo(540, 470, 360, p, entrada);
  const pTexto = salida((t - esc.inicio - 1.3) / 0.7);
  if (pTexto > 0) {
    dibujarLinea(esc.lema, "referencia", 540, 925, pTexto, 16 * (1 - pTexto));
    dibujarLinea(esc.nombre, "normal", 540, 1010, pTexto, 16 * (1 - pTexto));
  }
  const pCta = salida((t - esc.inicio - 1.9) / 0.7);
  if (pCta > 0) {
    ctx.save();
    ctx.globalAlpha = pCta;
    ctx.strokeStyle = `rgba(${ORO_RGB},0.6)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(440, 1095); ctx.lineTo(640, 1095); ctx.stroke();
    ctx.restore();
    esc.cta.forEach((linea, i) =>
      dibujarLinea(linea, "cita", 540, 1175 + i * 80, pCta, 16 * (1 - pCta)));
  }
}

// --- bucle ----------------------------------------------------------------
let GUION = null;

window.dibujar = function (t) {
  const dur = GUION.duracion;
  dibujarFondo(t, dur);
  const esc = GUION.escenas.find(e => t >= e.inicio && t < e.fin) || GUION.escenas[GUION.escenas.length - 1];
  if (esc.tipo === "cierre") dibujarCierre(esc, t);
  else {
    dibujarEscenaTexto(esc, t);
    // Marca de agua pequeña: el reel sigue siendo reconocible si se reenvía.
    dibujarLogo(540, 250, 70, 1, 0.55);
  }
};

window.cargar = async function (guion) {
  GUION = guion;
  await document.fonts.load('500 86px Cormorant');
  await document.fonts.load('500 112px Cormorant');
  await document.fonts.load('600 140px Cormorant');
  await document.fonts.load('600 104px Cormorant');
  await document.fonts.load('italic 500 82px Cormorant');
  await document.fonts.load('500 34px Montserrat');
  await document.fonts.ready;
};

// Vista previa en tiempo real al abrir la plantilla en el navegador.
const params = new URLSearchParams(location.search);
if (params.get("guion")) {
  fetch(params.get("guion")).then(r => r.json()).then(async g => {
    await window.cargar(g);
    const inicio = performance.now();
    const bucle = () => {
      window.dibujar(((performance.now() - inicio) / 1000) % g.duracion);
      requestAnimationFrame(bucle);
    };
    bucle();
  });
}
</script>
</body>
</html>
